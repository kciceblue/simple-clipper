[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-clipper"
version = "0.1.0"
description = "Local desktop audio/video transcription and text-based clipping tool."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "PySide6>=6.7",
    "faster-whisper>=1.0",
    "socksio>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
simple-clipper = "simple_clipper.app:main"

[project.urls]
Homepage = "https://github.com/kciceblue/simple-clipper"
Repository = "https://github.com/kciceblue/simple-clipper"
Issues = "https://github.com/kciceblue/simple-clipper/issues"

[tool.setuptools.packages.find]
where = ["src"]
